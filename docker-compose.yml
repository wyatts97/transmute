# Build and start:            docker compose up -d --build
# With GPU (VAAPI) encoding:  docker compose -f docker-compose.yml -f docker-compose.vaapi.yml up -d --build
services:
  transmute:
    # This fork builds its own image: upstream's published image doesn't
    # include the advanced encoding options.
    image: transmute-fork:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: transmute
    restart: unless-stopped
    ports:
        - 3313:3313
    volumes:
      - transmute_data:/app/data
      # Optional: mount a custom stylesheet for Markdown/document -> PDF output.
      # - ./pdf-custom.css:/app/data/pdf/custom.css:ro
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "-q"
        - "-O"
        - "/dev/null"
        - "--tries=1"
        - "http://localhost:3313/api/health/ready"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  transmute_data:
